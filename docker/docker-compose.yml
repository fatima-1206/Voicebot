
services:
  # PostgreSQL Database
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: voicebot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: voicebot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=voicebot
      - DB_PASSWORD=voicebot_password
      - DB_URL=postgresql://postgres:voicebot_password@db:5432/voicebot
      - SECRET_KEY=your-secret-key-here-change-this-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ../backend/rag/knowledge_base:/app/backend/rag/knowledge_base
      - ../backend/rag/cache:/app/backend/rag/cache
      - ../backend/rag/vector_stores:/app/backend/rag/vector_stores
      - ./config.docker.json:/app/config.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker
  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=voicebot
      - DB_PASSWORD=voicebot_password
      - DB_URL=postgresql://postgres:voicebot_password@db:5432/voicebot
      - SECRET_KEY=your-secret-key-here-change-this-in-production
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ../backend/rag/knowledge_base:/app/backend/rag/knowledge_base
      - ../backend/rag/cache:/app/backend/rag/cache
      - ../backend/rag/vector_stores:/app/backend/rag/vector_stores
      - ../backend/rag/temp_audioFiles:/app/backend/rag/temp_audioFiles
      - ./config.docker.json:/app/config.json
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.workers.celery_worker.celery_app worker --loglevel=info --concurrency=1 --hostname=voicebot@%h

volumes:
  postgres_data: